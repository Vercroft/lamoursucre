# Weekly, grouped, with a 7-day cooldown. Security updates skip the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 has no compiler API yet and the build tooling needs it. Revisit at 7.1.
      - dependency-name: "typescript"
        versions: [">=7"]
      # The types follow the Node LTS in .nvmrc (24).
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      npm-root:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/deploy"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-deploy:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
