# OpenSSF Scorecard: supply-chain checks on this public repository. No secrets:
# the results are published with the workflow's own token (OIDC) and shown in the Security tab.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "37 5 * * 2"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      actions: read # Scorecard reads workflow settings
      security-events: write # upload the SARIF results
      id-token: write # publish results with the workflow's OIDC identity
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # ossf/scorecard-action@v2.5.0 (tag v2.5.0 -> this commit, published 2026-10-12)
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # github/codeql-action@v4.39.1 (tag v4.39.1 -> this commit, published 2026-10-21)
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
