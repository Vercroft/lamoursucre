# Deploy on push to main: build here, upload only. Static files, no Worker script.
# The build job runs the same checks as ci.yml (lint, build) on the same commit and
# holds no secret; the deploy job needs it, so a failed check stops the deploy.
# The deploy job runs in the "production" environment, does no checkout, and
# receives only the staged files and the two secrets.
#
# Settings of the "production" environment (the owner sets them in GitHub):
# - secret CLOUDFLARE_API_TOKEN: Workers Editor on the lamoursucre Worker only
#   (docs/OPERATIONS.md, "Deploy").
# - secret CLOUDFLARE_ACCOUNT_ID: the account id (a secret so logs mask it).
# - deployment branches: main only.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - run: node scripts/check-hidden-unicode.mjs
      - run: npm ci
      - run: npx biome ci .
      - run: npm run build
      # The deploy job does no checkout: everything it needs goes through this artifact.
      - name: Stage the deploy folder
        run: |
          mkdir stage
          cp -r out stage/out
          cp wrangler.jsonc stage/
          cp deploy/package.json deploy/package-lock.json stage/
          cp .nvmrc stage/node-version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-deploy
          path: stage/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-deploy
          path: site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "site/node-version"
          package-manager-cache: false
      - name: Check the secrets are set
        env:
          # Booleans only: the values never reach this step.
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ] || [ "$ACCOUNT_SET" != "true" ]; then
            echo "The production environment needs secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      # Wrangler and its dependencies come from the committed lockfile
      # (deploy/package-lock.json), without install scripts. The lockfile was made
      # with the 7-day cooldown (docs/OPERATIONS.md, "Update wrangler").
      - name: Install wrangler from the lockfile
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy
        working-directory: site
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
